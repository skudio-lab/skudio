x solid rgba(255,255,255,.09);background-image:linear-gradient(90deg,rgba(255,255,255,.075) 1px,transparent 1px);background-size:var(--cell) 100%}.head{position:sticky;top:0;z-index:7;min-height:70px}.head .left{z-index:9;display:grid;grid-template-columns:minmax(170px,1fr) 110px 92px 62px;align-items:end;padding:0 13px 10px;color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.65px}.head .timeline{z-index:8;background-color:rgba(8,17,25,.96)}.month-band{height:28px;position:relative;border-bottom:1px solid rgba(255,255,255,.13)}.month-label{position:absolute;top:0;height:28px;padding:7px 8px;border-right:1px solid rgba(255,255,255,.14);color:var(--ink);font-size:10px;font-weight:750}.day-band{display:flex;height:42px}.day-cell{flex:0 0 var(--cell);padding-top:7px;text-align:center;color:var(--muted);font-size:9px;border-right:1px solid rgba(255,255,255,.055)}.day-cell.weekend{background:rgba(189,168,255,.07)}.day-cell.today{color:#09211d;background:var(--mint);font-weight:900}.group-row{min-height:38px}.group-row .left{min-height:38px;display:flex;align-items:center;gap:9px;padding:0 13px;background:linear-gradient(110deg,rgba(124,247,212,.17),rgba(189,168,255,.14)),rgba(8,20,22,.97);font-size:12px;font-weight:800}.group-row .timeline{min-height:38px;background-color:rgba(124,247,212,.035)}.group-toggle{width:23px;height:23px;border:0;border-radius:50%;color:var(--ink);background:rgba(255,255,255,.10);cursor:pointer}.group-count{margin-left:auto;color:var(--muted);font-size:10px;font-weight:500}.task-left{height:var(--row);display:grid;grid-template-columns:minmax(170px,1fr) 110px 92px 62px;align-items:center;padding:0 10px 0 14px;gap:8px;cursor:pointer}.task-left:hover{background:rgba(255,255,255,.04)}.task-title{min-width:0}.task-title strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}.task-title small{display:block;color:var(--muted);font-size:9px}.owner{overflow:hidden;text-overflow:ellipsis;white-space:no .topbar{background:linear-gradient(130deg,rgba(255,255,255,.78),rgba(204,255,240,.46) 48%,rgba(225,215,255,.56))}.kicon{filter:none}.field,.search input,select{border-color:rgba(58,97,88,.18);background:rgba(255,255,255,.48);color:#10221e}select option{background:#f5fbf8}.btn{border-color:rgba(58,97,88,.18);background:rgba(255,255,255,.45);color:#16342c}.btn:hover{background:rgba(255,255,255,.72)}.toolbar{border-color:rgba(58,97,88,.10);background:rgba(255,255,255,.30)}.toolbar-group{border-color:rgba(58,97,88,.12);background:rgba(255,255,255,.34)}.board{background:rgba(255,255,255,.22)}.left{border-color:rgba(53,87,79,.14);background:linear-gradient(110deg,rgba(255,255,255,.88),rgba(246,244,255,.84));box-shadow:10px 0 25px rgba(55,82,76,.10)}.timeline{border-color:rgba(53,87,79,.10);background-image:linear-gradient(90deg,rgba(35,75,66,.08) 1px,transparent 1px)}.head .timeline{background-color:rgba(244,251,249,.96)}.month-band{border-color:rgba(53,87,79,.13)}.month-label{border-color:rgba(53,87,79,.12);color:#10221e}.day-cell{border-color:rgba(53,87,79,.07);color:#526b64}.day-cell.weekend{background:rgba(189,168,255,.13)}.group-row .left{background:linear-gradient(110deg,rgba(124,247,212,.30),rgba(189,168,255,.22)),rgba(255,255,255,.88)}.group-row .timeline{background-color:rgba(124,247,212,.08)}.group-toggle{color:#173a31;background:rgba(255,255,255,.58)}.task-left:hover{background:rgba(124,247,212,.10)}.owner{color:#38574f}.status.todo{color:#3d5750;background:rgba(52,83,75,.10)}.progress-track{background:rgba(42,77,68,.12)}.modal-backdrop{background:rgba(226,240,237,.70)}.btn.danger{color:#762d3a;border-color:rgba(172,67,87,.28)}

<body>
<svg class="defs" aria-hidden="true"><defs><filter id="planner-glass" x="-18%" y="-18%" width="136%" height="136%" color-interpolation-filters="sRGB"><feTurbulence type="fractalNoise" baseFrequency="0.012 0.018" numOctaves="2" seed="7" result="field"/><feGaussianBlur in="field" stdDeviation="1.15" result="softField"/><feDisplacementMap in="SourceGraphic" in2="softField" scale="11" xChannelSelector="R" yChannelSelector="G" result="refracted"/><feSpecularLighting in="softField" surfaceScale="3" specularConstant=".38" specularExponent="18" lighting-color="#fff" result="specular"><feDistantLight azimuth="-60" elevation="48"/></feSpecularLighting><feComposite in="specular" in2="SourceGraphic" operator="in" result="rim"/><feBlend in="refracted" in2="rim" mode="screen"/></filter></defs></svg>
<div class="app">
  <header class="topbar glass">
    <div class="brand"><img class="kicon" src="https://koboyo.com/icons/svg/folder-files.svg" alt=""><div><h1>A DIN PROJECT PLANNER</h1><small>GANTT · LOCAL WORKSPACE</small></div></div>
    <div class="spacer"></div>
    <div class="search"><img class="kicon" src="https://koboyo.com/icons/svg/file-search.svg" alt=""><input id="search" placeholder="搜尋任務、專案或負責人…" aria-label="搜尋任務"></div>
    <button class="btn" id="importBtn"><img class="kicon" src="https://koboyo.com/icons/svg/folder-open.svg" alt="">匯入</button>
    <button class="btn" id="exportBtn"><img class="kicon" src="https://koboyo.com/icons/svg/duplicate-action.svg" alt="">匯出</button>
    <button class="btn primary" id="addBtn"><span aria-hidden="true">＋</span>新增任務</button>
    <input type="file" id="importFile" accept="application/json" hidden>
  </header>
  <section class="summary" id="summary"></section>
  <section class="planner glass">
    <div class="toolbar">
      <div class="toolbar-group" aria-label="時間尺度"><button class="seg active" data-scale="day">日</button><button class="seg" data-scale="week">週</button><button class="seg" data-scale="month">月</button></div>
      <select id="ownerFilter" aria-label="負責人篩選"><option value="">全部負責人</option></select>
      <select id="statusFilter" aria-label="狀態篩選"><option value="">全部狀態</option><option value="todo">未開始</option><option value="doing">進行中</option><option value="risk">有風險</option><option value="done">已完成</option></select>
      <label class="view-control">時間軸起點 <input id="viewStart" type="date" aria-label="時間軸起點"></label>
      <label class="view-control">範圍 <select id="viewDays" aria-label="顯示範圍"><option value="30">30 天</option><option value="60">60 天</option><option value="90" selected>90 天</option><option value="180">180 天</option><option value="365">365 天</option></select></label>
      <button class="btn" id="todayBtn">定位今天</button>
      <button class="btn" id="resetBtn" title="還原以本週為起點的動態範例資料">重設範例</button>
      <span class="hint">拖曳任務條移動日期 · 拖曳右緣調整工期 · 點擊任務編輯</span>
    </div>
    <div class="board" id="board"><div class="grid" id="grid"></div></div>
  </section>
</div>
<div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <form class="modal glass" id="taskForm">
    <div class="modal-head"><h2 id="modalTitle">新增任務</h2><button type="button" class="btn icon" id="closeModal" aria-label="關閉">×</button></div>
    <input type="hidden" id="taskId">
    <div class="form-grid">
      <label>專案／群組<input class="field" id="project" required maxlength="60"></label>
      <label>任務名稱<input class="field" id="title" required maxlength="100"></label>
      <label>負責人<input class="field" id="owner" required maxlength="60"></label>
      <label>相依任務<select id="dependency"><option value="">無</option></select></label>
      <label>開始日期<input class="field" id="start" type="date" required></label>
      <label>結束日期<input class="field" id="end" type="date" required></label>
      <label>工作天數<input class="field" id="duration" type="number" min="1" max="9999" step="1" value="1" required><span class="duration-note">依週末規則自動計算結束日期</span></label>
      <label>狀態<select id="status"><option value="todo">未開始</option><option value="doing">進行中</option><option value="risk">有風險</option><option value="done">已完成</option></select></label>
      <label>優先級<select id="priority"><option value="normal">一般</option><option value="high">高</option><option value="critical">關鍵</option></select></label>
      <label>進度（%）<input class="field" id="taskProgress" type="number" min="0" max="100" step="5" value="0"></label>
      <label>週末規則<select id="weekend"><option value="include">六、日都計入工作天</option><option value="exclude">排除六、日</option><option value="sat">只排除週六</option><option value="sun">只排除週日</option></select></label>
      <label class="wide">備註<input class="field" id="note" maxlength="180" placeholder="交付物、風險或設計決策…"></label>
    </div>
    <div class="modal-actions"><button type="button" class="btn danger hidden" id="deleteBtn">刪除任務</button><div class="spacer"></div><button type="button" class="btn" id="cancelModal">取消</button><button class="btn primary" type="submit">儲存任務</button></div>
  </form>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
const DAY=86400000,STORE='adin-project-planner-v2',VIEW_STORE='adin-project-view-v2';
const date=s=>new Date(`${s}T00:00:00`),iso=d=>{const x=new Date(d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`},add=(s,n)=>iso(date(s).getTime()+n*DAY),diff=(a,b)=>Math.round((date(b)-date(a))/DAY),days=t=>diff(t.start,t.end)+1;
function mondayOfToday(){const d=new Date(),day=(d.getDay()+6)%7;d.setHours(0,0,0,0);d.setDate(d.getDate()-day);return iso(d)}
function makeSeed(){const base=mondayOfToday(),make=(id,project,title,owner,offset,duration,weekend,status,priority,progress,dependency='',note='')=>{const start=nextWorkday(add(base,offset),weekend);return{id,project,title,owner,start,end:endFromWorkdays(start,duration,weekend),duration,weekend,status,priority,progress,dependency,note}};return[
 make('t1','CD8021','SMT','Dian',0,2,'include','done','high',100,'','動態範例：以本週為起點'),
 make('t2','CD8021','FATP','Dian',2,4,'exclude','doing','high',65,'t1','SMT 完成後開始'),
 make('t3','CG8829','SMT','Monica, Jane',6,3,'exclude','doing','normal',45),
 make('t4','CG8829','FATP','Monica, Jane',9,2,'exclude','todo','normal',0,'t3'),
 make('t5','SB8200','SMT','Monica, Jane',7,3,'sun','risk','critical',35,'','注意跨專案資源衝突'),
 make('t6','SB8200','FATP','Monica, Jane',10,2,'exclude','todo','high',0,'t5')
]}
const seed=makeSeed();
let tasks=load(),scale='day',collapsed=new Set(),drag=null,view=loadView();
const $=s=>document.querySelector(s),grid=$('#grid'),board=$('#board');
function load(){try{const current=JSON.parse(localStorage.getItem(STORE));return Array.isArray(current)&&current.length?current.map(normalizeTask):structuredClone(seed)}catch{return structuredClone(seed)}}
function save(){localStorage.setItem(STORE,JSON.stringify(tasks))}
function excluded(s,rule){const d=date(s).getDay();return rule==='exclude'?(d===0||d===6):rule==='sat'?d===6:rule==='sun'?d===0:false}
function nextWorkday(s,rule,step=1){let out=s,guard=0;while(excluded(out,rule)&&guard++<8)out=add(out,step);return out}
function endFromWorkdays(start,duration,rule){let cursor=nextWorkday(start,rule),remaining=Math.max(1,Math.round(+duration||1))-1,guard=0;while(remaining>0&&guard++<10000){cursor=add(cursor,1);if(!excluded(cursor,rule))remaining--}return cursor}
function workdaysBetween(start,end,rule){let cursor=nextWorkday(start,rule),last=end,count=0,guard=0;if(last<cursor)return 1;while(cursor<=last&&guard++<10000){if(!excluded(cursor,rule))count++;cursor=add(cursor,1)}return Math.max(1,count)}
function normalizeTask(t){const weekend=['include','exclude','sat','sun'].includes(t.weekend)?t.weekend:'exclude',start=nextWorkday(t.start||mondayOfToday(),weekend),duration=Math.max(1,Math.round(+t.duration||workdaysBetween(start,t.end||start,weekend)));return{...t,start,end:endFromWorkdays(start,duration,weekend),duration,weekend}}
function loadView(){try{const v=JSON.parse(localStorage.getItem(VIEW_STORE));return{start:v.start||mondayOfToday(),days:+v.days||90}}catch{return{start:mondayOfToday(),days:90}}}
function saveView(){localStorage.setItem(VIEW_STORE,JSON.stringify(view))}
const escapeHTML=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function visible(){const q=$('#search').value.trim().toLowerCase(),o=$('#ownerFilter').value,s=$('#statusFilter').value;return tasks.filter(t=>(!q||`${t.project} ${t.title} ${t.owner} ${t.note}`.toLowerCase().includes(q))&&(!o||t.owner===o)&&(!s||t.status===s))}
function bounds(list){let start=view.start||mondayOfToday(),end=add(start,Math.max(30,view.days)-1);for(const t of list){if(t.start<start)start=add(t.start,-3);if(t.end>end)end=add(t.end,7)}return{start,end,count:diff(start,end)+1}}
function statusText(s){return{todo:'未開始',doing:'進行中',risk:'有風險',done:'已完成'}[s]||s}
function barColor(t){return t.priority==='critical'?'#ff8fa3':t.priority==='high'?'#ffd37c':t.status==='done'?'#7cf7d4':'#a9b8ff'}
function render(){const list=visible(),b=bounds(list),cell=scale==='day'?34:scale==='week'?19:scale==='month'?10:34;document.documentElement.style.setProperty('--cell',`${cell}px`);document.documentElement.style.setProperty('--timeline',`${b.count*cell}px`);renderSummary();renderOwners();let html=headerHTML(b,cell),groups=Object.groupBy?Object.groupBy(list,t=>t.project):list.reduce((a,t)=>((a[t.project]??=[]).push(t),a),{});for(const [project,items] of Object.entries(groups)){html+=`<div class="grid-row group-row"><div class="left"><button class="group-toggle" data-group="${escapeHTML(project)}">${collapsed.has(project)?'+':'−'}</button><span>${escapeHTML(project)}</span><span class="group-count">${items.length} TASKS</span></div><div class="timeline"></div></div>`;if(!collapsed.has(project))for(const t of items)html+=taskHTML(t,b,cell)}if(!list.length)html+=`<div class="empty">沒有符合目前條件的任務</div>`;grid.innerHTML=html;bindRows();drawToday(b,cell)}
function headerHTML(b,cell){let month='',day='',cursor=date(b.start),runStart=0,last='';for(let i=0;i<b.count;i++){const key=`${cursor.getFullYear()}-${cursor.getMonth()}`,label=cursor.toLocaleDateString('zh-TW',{year:'numeric',month:'long'});if(key!==last){if(last)month+=`</div>`;month+=`<div class="month-label" style="left:${i*cell}px" data-start="${i}">${label}`;last=key}const weekend=cursor.getDay()===0||cursor.getDay()===6,today=iso(cursor)===iso(new Date());day+=`<div class="day-cell ${weekend?'weekend':''} ${today?'today':''}" title="${iso(cursor)}">${scale==='month'?(cursor.getDate()===1?cursor.getMonth()+1:''):scale==='week'?(cursor.getDay()===1?`${cursor.getMonth()+1}/${cursor.getDate()}`:''):cursor.getDate()}</div>`;cursor=new Date(cursor.getTime()+DAY)}month+='</div>';setTimeout(()=>{document.querySelectorAll('.month-label').forEach((el,i,a)=>{const next=a[i+1],start=+el.dataset.start,end=next?+next.dataset.start:b.count;el.style.width=`${(end-start)*cell}px`})});return`<div class="grid-row head"><div class="left"><span>任務／專案</span><span>負責人</span><span>進度</span><span>狀態</span></div><div class="timeline"><div class="month-band">${month}</div><div class="day-band">${day}</div></div></div>`}
function taskHTML(t,b,cell){const left=diff(b.start,t.start)*cell,width=Math.max(12,days(t)*cell),dep=t.dependency?tasks.find(x=>x.id===t.dependency):null;return`<div class="grid-row task-row" data-id="${t.id}"><div class="left task-left"><div class="task-title"><strong>${escapeHTML(t.title)}</strong><small>${escapeHTML(t.project)} · ${t.start} → ${t.end}${dep?` · AFTER ${escapeHTML(dep.title)}`:''}</small></div><div class="owner">${escapeHTML(t.owner)}</div><div class="progress"><div class="progress-track"><div class="progress-fill" style="width:${t.progress}%"></div></div><span>${t.progress}%</span></div><span class="status ${t.status}">${statusText(t.status)}</span></div><div class="timeline task-timeline"><div class="bar" data-id="${t.id}" style="left:${left}px;width:${width}px;--bar:${barColor(t)};--progress:${t.progress}%" title="拖曳移動，右緣調整工期"><div class="bar-fill"></div><span class="bar-label">${escapeHTML(t.title)} · ${t.duration} 工作天</span><span class="resize" data-resize="1"></span></div></div></div>`}
function drawToday(b,cell){const n=diff(b.start,iso(new Date()));if(n>=0&&n<b.count){const line=document.createElement('div');line.className='today-line';line.style.left=`calc(var(--list) + ${n*cell}px)`;grid.append(line)}}
function renderSummary(){const total=tasks.length,done=tasks.filter(t=>t.status==='done').length,risk=tasks.filter(t=>t.status==='risk').length,avg=total?Math.round(tasks.reduce((a,t)=>a+t.progress,0)/total):0,projects=new Set(tasks.map(t=>t.project)).size;$('#summary').innerHTML=[['專案',projects,'目前群組','rgba(124,247,212,.2)'],['任務',total,`${done} 已完成`,'rgba(189,168,255,.22)'],['平均進度',`${avg}%`,'依任務平均','rgba(124,247,212,.2)'],['風險',risk,risk?'需要關注':'狀態正常','rgba(255,151,190,.25)'],['完成率',total?`${Math.round(done/total*100)}%`:'0%','完成任務占比','rgba(255,211,124,.2)']].map(x=>`<article class="metric glass" style="--glow:${x[3]}"><div class="metric-label">${x[0]}</div><div class="metric-value">${x[1]}</div><div class="metric-note">${x[2]}</div></article>`).join('')}
function renderOwners(){const el=$('#ownerFilter'),value=el.value,owners=[...new Set(tasks.map(t=>t.owner))].sort();el.innerHTML='<option value="">全部負責人</option>'+owners.map(o=>`<option ${o===value?'selected':''}>${escapeHTML(o)}</option>`).join('')}
function bindRows(){document.querySelectorAll('.group-toggle').forEach(b=>b.onclick=()=>{const g=b.dataset.group;collapsed.has(g)?collapsed.delete(g):collapsed.add(g);render()});document.querySelectorAll('.task-left').forEach(el=>el.onclick=()=>openModal(el.closest('.task-row').dataset.id));document.querySelectorAll('.bar').forEach(el=>el.onpointerdown=startDrag)}
function startDrag(e){e.preventDefault();e.stopPropagation();const el=e.currentTarget,t=tasks.find(x=>x.id===el.dataset.id),style=getComputedStyle(el);drag={el,t,x:e.clientX,start:t.start,end:t.end,duration:t.duration,weekend:t.weekend,resize:!!e.target.dataset.resize,cell:parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--cell')),left:parseFloat(style.left),width:parseFloat(style.width),delta:0};el.setPointerCapture(e.pointerId)}
addEventListener('pointermove',e=>{if(!drag)return;const raw=Math.round((e.clientX-drag.x)/drag.cell),min=-(diff(drag.start,drag.end));drag.delta=drag.resize?Math.max(raw,min):raw;if(drag.resize)drag.el.style.width=`${Math.max(12,drag.width+drag.delta*drag.cell)}px`;else drag.el.style.left=`${drag.left+drag.delta*drag.cell}px`});addEventListener('pointerup',()=>{if(!drag)return;if(drag.resize){const candidate=add(drag.end,drag.delta);drag.t.duration=workdaysBetween(drag.start,candidate,drag.weekend);drag.t.end=endFromWorkdays(drag.start,drag.t.duration,drag.weekend)}else{drag.t.start=nextWorkday(add(drag.start,drag.delta),drag.weekend,drag.delta<0?-1:1);drag.t.end=endFromWorkdays(drag.t.start,drag.duration,drag.weekend)}save();toast(drag.resize?'工作天數與結束日已更新':'日期已依週末規則移動');drag=null;render()});
function openModal(id=''){const t=tasks.find(x=>x.id===id),rule=t?.weekend||'exclude',start=t?.start||nextWorkday(iso(new Date()),rule),duration=t?.duration||5;$('#modalTitle').textContent=t?'編輯任務':'新增任務';$('#taskId').value=t?.id||'';$('#project').value=t?.project||tasks.at(-1)?.project||'NEW PROJECT';$('#title').value=t?.title||'';$('#owner').value=t?.owner||'Dian';$('#start').value=start;$('#duration').value=duration;$('#end').value=t?.end||endFromWorkdays(start,duration,rule);$('#status').value=t?.status||'todo';$('#priority').value=t?.priority||'normal';$('#taskProgress').value=t?.progress??0;$('#weekend').value=rule;$('#note').value=t?.note||'';$('#dependency').innerHTML='<option value="">無</option>'+tasks.filter(x=>x.id!==id).map(x=>`<option value="${x.id}" ${x.id===t?.dependency?'selected':''}>${escapeHTML(x.project)} · ${escapeHTML(x.title)}</option>`).join('');$('#deleteBtn').classList.toggle('hidden',!t);$('#modalBackdrop').classList.add('open');setTimeout(()=>$('#title').focus(),30)}
function closeModal(){$('#modalBackdrop').classList.remove('open')}
let syncingDates=false;function syncEndFromDuration(){if(syncingDates)return;syncingDates=true;const rule=$('#weekend').value,start=nextWorkday($('#start').value||iso(new Date()),rule),duration=Math.max(1,Math.round(+$('#duration').value||1));$('#start').value=start;$('#duration').value=duration;$('#end').value=endFromWorkdays(start,duration,rule);syncingDates=false}function syncDurationFromEnd(){if(syncingDates)return;syncingDates=true;const rule=$('#weekend').value,start=nextWorkday($('#start').value||iso(new Date()),rule),requested=$('#end').value||start,duration=workdaysBetween(start,requested,rule);$('#start').value=start;$('#duration').value=duration;$('#end').value=endFromWorkdays(start,duration,rule);syncingDates=false}
$('#start').onchange=syncEndFromDuration;$('#duration').oninput=syncEndFromDuration;$('#weekend').onchange=syncEndFromDuration;$('#end').onchange=syncDurationFromEnd;
$('#taskForm').onsubmit=e=>{e.preventDefault();syncEndFromDuration();const id=$('#taskId').value||`t${Date.now()}`,old=tasks.find(x=>x.id===id),rule=$('#weekend').value,start=$('#start').value,duration=Math.max(1,Math.round(+$('#duration').value||1)),obj={id,project:$('#project').value.trim(),title:$('#title').value.trim(),owner:$('#owner').value.trim(),start,end:endFromWorkdays(start,duration,rule),duration,status:$('#status').value,priority:$('#priority').value,progress:Math.max(0,Math.min(100,+$('#taskProgress').value||0)),weekend:rule,dependency:$('#dependency').value,note:$('#note').value.trim()};if(old)Object.assign(old,obj);else tasks.push(obj);save();closeModal();render();toast(old?'任務已更新':'任務已新增')};
$('#deleteBtn').onclick=()=>{const id=$('#taskId').value;if(!id)return;tasks=tasks.filter(t=>t.id!==id).map(t=>t.dependency===id?{...t,dependency:''}:t);save();closeModal();render();toast('任務已刪除')};$('#addBtn').onclick=()=>openModal();$('#closeModal').onclick=$('#cancelModal').onclick=closeModal;$('#modalBackdrop').onclick=e=>{if(e.target===e.currentTarget)closeModal()};
$('#search').oninput=render;$('#ownerFilter').onchange=render;$('#statusFilter').onchange=render;document.querySelectorAll('.seg').forEach(b=>b.onclick=()=>{scale=b.dataset.scale;document.querySelectorAll('.seg').forEach(x=>x.classList.toggle('active',x===b));render()});
$('#viewStart').value=view.start;$('#viewDays').value=String(view.days);$('#viewStart').onchange=e=>{view.start=e.target.value||mondayOfToday();saveView();render()};$('#viewDays').onchange=e=>{view.days=+e.target.value||90;saveView();render()};
$('#todayBtn').onclick=()=>{const b=bounds(visible()),cell=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--cell')),n=diff(b.start,iso(new Date()));board.scrollTo({left:Math.max(0,n*cell-board.clientWidth/2+440),behavior:'smooth'})};
$('#resetBtn').onclick=()=>{if(confirm('確定還原動態範例資料？目前本機修改會被取代。')){tasks=makeSeed();view={start:mondayOfToday(),days:90};$('#viewStart').value=view.start;$('#viewDays').value='90';save();saveView();render();toast('已還原以本週為起點的範例')}};
$('#exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify({version:2,exportedAt:new Date().toISOString(),view,tasks},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`A-DIN-Project-${iso(new Date())}.json`;a.click();URL.revokeObjectURL(a.href);toast('專案資料已匯出')};$('#importBtn').onclick=()=>$('#importFile').click();$('#importFile').onchange=async e=>{try{const data=JSON.parse(await e.target.files[0].text()),incoming=Array.isArray(data)?data:data.tasks;if(!Array.isArray(incoming))throw Error();tasks=incoming.map(normalizeTask);if(data.view){view={start:data.view.start||mondayOfToday(),days:+data.view.days||90};$('#viewStart').value=view.start;$('#viewDays').value=String(view.days);saveView()}save();render();toast('專案資料已匯入並重新計算日期')}catch{toast('JSON 格式無法辨識')}e.target.value=''};
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),2200)}
addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='n'){e.preventDefault();openModal()}});addEventListener('pointermove',e=>{document.documentElement.style.setProperty('--mx',`${e.clientX}px`);document.documentElement.style.setProperty('--my',`${e.clientY}px`)});render();
</script>
