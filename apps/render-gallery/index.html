.card-actions{display:flex;align-items:center;gap:4px;width:100%;min-width:0;margin-top:5px;padding:3px;border:1px solid rgba(255,255,255,.24);border-radius:999px;background:linear-gradient(145deg,rgba(72,78,90,.72),rgba(38,44,56,.58));box-shadow:inset 0 1px rgba(255,255,255,.30),inset 0 -1px rgba(0,0,0,.14),0 6px 16px rgba(0,0,0,.18);backdrop-filter:blur(18px) saturate(1.3)}.card-actions .name{flex:1 1 auto;width:auto;min-width:0;margin:0;padding:7px 8px 7px 10px!important;border:0!important;border-radius:999px;background:transparent!important;box-shadow:none!important}.card-actions .card-save{position:static;flex:0 0 auto;width:28px;height:28px;margin:0;border-color:rgba(255,255,255,.38);box-shadow:inset 0 1px rgba(255,255,255,.60),0 2px 8px rgba(0,0,0,.22)}.viewer-actions{gap:3px;padding:4px;border:1px solid rgba(255,255,255,.30);border-radius:999px;background:linear-gradient(145deg,rgba(52,61,76,.72),rgba(15,24,39,.58));box-shadow:inset 0 1px rgba(255,255,255,.34),inset 0 -1px rgba(0,0,0,.16),0 12px 30px rgba(0,0,0,.34);backdrop-filter:blur(24px) saturate(1.4)}.viewer-actions .caption{flex:1 1 auto;margin:0;padding:9px 12px;border:0;background:transparent;box-shadow:none;backdrop-filter:none}.viewer-actions .viewer-save,.viewer-actions .close{width:36px;height:36px;border-color:rgba(255,255,255,.38);box-shadow:inset 0 1px rgba(255,255,255,.60),0 2px 9px rgba(0,0,0,.22)}.viewer-actions .close{font-size:23px}@media(max-width:600px){.card-actions{padding:3px}.card-actions .card-save{width:27px;height:27px}.viewer-actions{gap:2px;padding:3px}.viewer-actions .caption{max-width:calc(100vw - 108px);padding:8px 9px}.viewer-actions .viewer-save,.viewer-actions .close{width:34px;height:34px}}
/* Liquid Glass 4.0 — Kube refractive optics + Koboyo controls */
:root{--accent:#7cf7d4;--accent-2:#bda8ff;--ink:#f7fffc;--sub:#c8d8d4;--glass-edge:rgba(255,255,255,.34);--glass-shadow:rgba(0,8,13,.38)}
body{background:radial-gradient(circle at 10% 8%,rgba(124,247,212,.32),transparent 34%),radial-gradient(circle at 88% 14%,rgba(189,168,255,.34),transparent 36%),radial-gradient(circle at 52% 96%,rgba(255,151,190,.25),transparent 42%),linear-gradient(145deg,#071b19,#101126 72%,#240e20);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);background-size:44px 44px}
body::after{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;background:radial-gradient(circle 340px at var(--mx) var(--my),rgba(255,255,255,.15),transparent 72%)}
.liquid-glass-defs{position:absolute;width:0;height:0;overflow:hidden;pointer-events:none}
header,.empty,.card,.loading,.card-actions,.viewer-actions,.nav{background:linear-gradient(145deg,rgba(255,255,255,.18),rgba(255,255,255,.055));border-color:var(--glass-edge);box-shadow:inset 0 1px rgba(255,255,255,.58),inset 0 -1px rgba(255,255,255,.07),0 18px 46px var(--glass-shadow);-webkit-backdrop-filter:blur(24px) saturate(1.32);backdrop-filter:blur(24px) saturate(1.32)}
header{background:linear-gradient(130deg,rgba(124,247,212,.16),rgba(255,255,255,.08) 45%,rgba(189,168,255,.15))}
.card{background:linear-gradient(145deg,rgba(255,255,255,.16),rgba(124,247,212,.045) 55%,rgba(189,168,255,.07))}
.card-actions,.viewer-actions{background:linear-gradient(145deg,rgba(20,35,38,.72),rgba(25,20,43,.64));border-color:rgba(255,255,255,.30)}
.card-actions .name,.viewer-actions .caption{color:#fff!important;text-shadow:0 1px 2px rgba(0,0,0,.55)}
.button{background:linear-gradient(145deg,#ecfff9,#9eeed8);border-color:rgba(255,255,255,.86);color:#10231f}
.range-capsule{background:linear-gradient(145deg,rgba(124,247,212,.24),rgba(189,168,255,.13));border-color:rgba(255,255,255,.52)}
#size{background:linear-gradient(90deg,var(--accent) 0 var(--range-fill,20%),rgba(4,20,22,.30) var(--range-fill,20%) 100%)}
#size::-webkit-slider-thumb{background:linear-gradient(145deg,#f6fffc,#a8eedb)}#size::-moz-range-thumb{background:linear-gradient(145deg,#f6fffc,#a8eedb)}
.loading-fill{background:linear-gradient(90deg,var(--accent),var(--accent-2));box-shadow:0 0 14px rgba(124,247,212,.48)}
.card-save .kicon,.viewer-save .kicon{width:16px;height:16px}.viewer-save .kicon{width:19px;height:19px}
@supports ((backdrop-filter:url("#render-liquid-glass")) or (-webkit-backdrop-filter:url("#render-liquid-glass"))){header,.empty,.card,.loading,.card-actions,.viewer-actions,.nav{-webkit-backdrop-filter:url("#render-liquid-glass") blur(10px) saturate(1.28);backdrop-filter:url("#render-liquid-glass") blur(10px) saturate(1.28)}}
@media(prefers-color-scheme:light){:root{--ink:#14231f;--sub:#425b55;--glass-shadow:rgba(38,64,59,.18)}body{background:radial-gradient(circle at 10% 7%,#c7f7e9 0,transparent 37%),radial-gradient(circle at 90% 15%,#e5dbff 0,transparent 38%),radial-gradient(circle at 52% 98%,#ffdce8 0,transparent 43%),linear-gradient(145deg,#f2fbf8,#edf0fb)}header,.empty,.card,.loading{background:linear-gradient(145deg,rgba(255,255,255,.66),rgba(255,255,255,.27));border-color:rgba(255,255,255,.86)}h1,.size-control{color:#152720}.card-actions,.viewer-actions{background:linear-gradient(145deg,rgba(43,55,58,.74),rgba(41,35,58,.66))}}
</style>
</head>
<body>
<svg class="liquid-glass-defs" aria-hidden="true" focusable="false"><defs><filter id="render-liquid-glass" x="-18%" y="-18%" width="136%" height="136%" color-interpolation-filters="sRGB"><feTurbulence type="fractalNoise" baseFrequency="0.012 0.018" numOctaves="2" seed="7" result="field"/><feGaussianBlur in="field" stdDeviation="1.15" result="softField"/><feDisplacementMap in="SourceGraphic" in2="softField" scale="11" xChannelSelector="R" yChannelSelector="G" result="refracted"/><feSpecularLighting in="softField" surfaceScale="3" specularConstant="0.38" specularExponent="18" lighting-color="#ffffff" result="specular"><feDistantLight azimuth="-60" elevation="48"/></feSpecularLighting><feComposite in="specular" in2="SourceGraphic" operator="in" result="rimLight"/><feBlend in="refracted" in2="rimLight" mode="screen"/></filter></defs></svg>
<header><div class="brand"><img class="kicon icon-light" src="https://koboyo.com/icons/svg/folder-files.svg" alt=""><h1>Render Gallery</h1></div><span id="count">尚未載入媒體</span><div class="search-wrap"><img class="kicon icon-light" src="https://koboyo.com/icons/svg/file-search.svg" alt=""><input id="search" type="search" placeholder="搜尋檔案名稱…" aria-label="搜尋檔案名稱"></div><label class="size-control">縮圖 <span class="range-capsule"><input id="size" type="range" min="140" max="360" value="190" aria-label="調整縮圖尺寸"></span></label><button class="button" id="pick"><img class="kicon" src="https://koboyo.com/icons/svg/folder-open.svg" alt="">選取資料夾</button><input id="files" type="file" webkitdirectory multiple accept="image/*,video/mp4" hidden></header>
<div class="loading" id="loading" role="status" aria-live="polite"><div class="loading-row"><span id="loadingText">正在載入資料夾…</span><span id="loadingPercent"></span></div><div class="loading-track"><div class="loading-fill" id="loadingFill"></div></div></div>
<main><section class="empty" id="empty"><img class="empty-icon" src="https://koboyo.com/icons/svg/card-photos.svg" alt=""><h2>選擇渲染圖資料夾</h2><p>開啟 <code>KeyShot\Renderings</code>，圖片與影片會立即整理成畫廊。</p><p class="hint">媒體只在本機顯示，不會上傳。支援 JPG、PNG、WebP、GIF、BMP、MP4。</p></section><section class="grid" id="grid"></section></main>
<div class="overlay" id="overlay" role="dialog" aria-modal="true"><div class="viewer"><button class="nav prev" aria-label="上一個"><img class="kicon icon-light" src="https://koboyo.com/icons/svg/back-navigation.svg" alt=""></button><img id="full" alt=""><video id="fullVideo" controls playsinline hidden></video><button class="nav next" aria-label="下一個"><img class="kicon icon-light" src="https://koboyo.com/icons/svg/forward-navigation.svg" alt=""></button><div class="viewer-actions"><div class="caption" id="caption"></div><button class="viewer-save" id="saveCurrent" aria-label="另存目前檔案" title="另存新檔"><img class="kicon icon-light" src="https://koboyo.com/icons/svg/duplicate-action.svg" alt=""></button><button class="close" aria-label="關閉" title="關閉">×</button></div></div></div>
<script>
const filesInput=document.querySelector('#files'),grid=document.querySelector('#grid'),empty=document.querySelector('#empty'),count=document.querySelector('#count'),overlay=document.querySelector('#overlay'),full=document.querySelector('#full'),fullVideo=document.querySelector('#fullVideo'),caption=document.querySelector('#caption'),search=document.querySelector('#search'),loading=document.querySelector('#loading'),loadingText=document.querySelector('#loadingText'),loadingPercent=document.querySelector('#loadingPercent'),loadingFill=document.querySelector('#loadingFill'),sizeSlider=document.querySelector('#size');let images=[],shown=[],active=0;
function mediaFiles(list){return [...list].filter(f=>f.type.startsWith('image/')||f.type==='video/mp4'||/\.mp4$/i.test(f.name)).sort((a,b)=>(a.webkitRelativePath||a.name).localeCompare(b.webkitRelativePath||b.name,undefined,{numeric:true}));}
function isVideo(f){return f.type==='video/mp4'||/\.mp4$/i.test(f.name)}function setLoading(mode,text,done=0,total=0){loading.classList.toggle('show',mode!=='hide');loading.classList.toggle('indeterminate',mode==='scan');loadingText.textContent=text;const pct=total?Math.round(done/total*100):0;loadingPercent.textContent=mode==='render'?`${pct}%`:'';loadingFill.style.width=mode==='render'?`${pct}%`:'';if(mode==='hide')loadingFill.style.width='0'}
async function load(list){setLoading('render','正在整理媒體…',0,list.length||1);await new Promise(requestAnimationFrame);images=mediaFiles(list);await filter(true);setLoading('hide','');}
async function filter(showProgress=false){const q=search.value.trim().toLowerCase();shown=images.filter(f=>(f.webkitRelativePath||f.name).toLowerCase().includes(q));grid.replaceChildren();empty.style.display=shown.length?'none':'block';count.textContent=images.length?`${shown.length.toLocaleString()} / ${images.length.toLocaleString()} 個媒體`:'找不到可顯示的媒體';for(let i=0;i<shown.length;i++){const file=shown[i],url=URL.createObjectURL(file),card=document.createElement('article'),media=isVideo(file)?`<video class="thumb" src="${url}" muted playsinline preload="metadata"></video>`:`<img class="thumb" loading="lazy" src="${url}" alt="">`;card.className='card';card.innerHTML=`${media}<div class="card-actions"><div class="name" title="${file.name}">${file.name}</div><button class="card-save" aria-label="另存 ${file.name}" title="另存新檔"><img class="kicon icon-light" src="https://koboyo.com/icons/svg/duplicate-action.svg" alt=""></button></div>`;const v=card.querySelector('video');if(v)v.onloadedmetadata=()=>v.style.aspectRatio=`${v.videoWidth}/${v.videoHeight}`;card.onclick=()=>open(i);card.querySelector('.card-save').onclick=e=>{e.stopPropagation();saveFile(file)};grid.append(card);if(showProgress&&(i%20===0||i===shown.length-1)){setLoading('render','正在建立媒體卡片…',i+1,Math.max(shown.length,1));await new Promise(requestAnimationFrame)}}}
function open(i){active=(i+shown.length)%shown.length;const f=shown[active],url=URL.createObjectURL(f);fullVideo.pause();if(isVideo(f)){full.hidden=true;full.src='';fullVideo.hidden=false;fullVideo.src=url;fullVideo.play().catch(()=>{})}else{fullVideo.hidden=true;fullVideo.removeAttribute('src');fullVideo.load();full.hidden=false;full.src=url;full.alt=f.name}caption.textContent=`${active+1} / ${shown.length}　${f.webkitRelativePath||f.name}`;overlay.classList.add('open');}
function close(){overlay.classList.remove('open');full.src='';fullVideo.pause();fullVideo.removeAttribute('src');fullVideo.load()}function move(n){if(shown.length)open(active+n)}
async function chooseFolder(){if(!window.showDirectoryPicker){filesInput.click();return}try{const dir=await window.showDirectoryPicker({mode:'read'}),out=[];setLoading('scan','正在讀取資料夾…');async function walk(h,path=''){for await(const [name,item] of h){if(item.kind==='file'){const f=await item.getFile();Object.defineProperty(f,'webkitRelativePath',{value:path+name});out.push(f)}else await walk(item,path+name+'/')}}await walk(dir);await load(out)}catch(e){setLoading('hide','');if(e.name!=='AbortError')filesInput.click()}}
async function saveFile(f){if(!f)return;try{if(window.showSaveFilePicker){const ext='.'+f.name.split('.').pop(),h=await showSaveFilePicker({suggestedName:f.name,types:[{description:'媒體檔案',accept:{[f.type||'application/octet-stream']:[ext]}}]});const w=await h.createWritable();await w.write(f);await w.close()}else{const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;a.click()}}catch(e){if(e.name!=='AbortError')alert('無法另存檔案，請檢查瀏覽器下載權限。')}}
document.querySelector('#pick').onclick=chooseFolder;filesInput.onchange=async e=>{await load(e.target.files);e.target.value=''};search.oninput=()=>filter(false);document.querySelector('.close').onclick=close;document.querySelector('.prev').onclick=()=>move(-1);document.querySelector('.next').onclick=()=>move(1);document.querySelector('#saveCurrent').onclick=()=>saveFile(shown[active]);overlay.onclick=e=>{if(e.target===overlay)close()};document.addEventListener('keydown',e=>{if(!overlay.classList.contains('open'))return;if(e.key==='Escape')close();if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1)});function updateSize(){const pct=(sizeSlider.value-sizeSlider.min)/(sizeSlider.max-sizeSlider.min)*100;sizeSlider.style.setProperty('--range-fill',`${pct}%`);grid.style.gridTemplateColumns=`repeat(auto-fill,minmax(${sizeSlider.value}px,1fr))`}sizeSlider.oninput=updateSize;updateSize();
document.addEventListener('pointermove',e=>{document.documentElement.style.setProperty('--mx',`${e.clientX}px`);document.documentElement.style.setProperty('--my',`${e.clientY}px`);const c=e.target.closest?.('.card');if(c){const r=c.getBoundingClientRect();c.style.setProperty('--gx',`${e.clientX-r.left}px`);c.style.setProperty('--gy',`${e.clientY-r.top}px`)}});addEventListener('scroll',()=>document.querySelector('header').classList.toggle('compact',scrollY>28),{passive:true});
</script></body></html>
